    <script>
        // Protect teacher portal — redirect to login if not authenticated or wrong role
        (function guardPortal() {
            if (!authManager.isAuthenticated()) {
                window.location.href = 'login.html';
                throw new Error('Not authenticated');
            }
            const session = authManager.getSession();
            // Teachers only. `staff` belongs on portal.html — the modules
            // permissionManager gives that role (Dashboard, Inventory, Fees)
            // are not loaded by this page, so a staff member landing here saw
            // three nav links that all rendered "coming soon".
            if (session.role !== 'teacher') {
                window.location.href = authManager.getRedirectUrl(session.role);
                throw new Error('Wrong portal for role: ' + session.role);
            }
        })();

        // ── Server-side verification ──────────────────────────────────────
        // The guard above reads the cached session so the page can paint without
        // waiting on the network. That cache lives in localStorage, which the
        // person at the keyboard can write, so on its own it decides nothing —
        // a hand-made entry would render this portal. This pass asks Supabase
        // for the real session and re-reads the profile, and keeps the portal
        // covered until the server agrees. It also means a suspended account
        // loses access on the next page load.
        (async function verifyPortalAccess() {
            const veil = document.createElement('div');
            veil.id = 'auth-verify-veil';
            veil.style.cssText = 'position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:1.1rem;color:#666;';
            veil.innerHTML = '<div style="text-align:center"><div style="font-size:2rem;margin-bottom:12px;">&#128274;</div><p>Verifying session&hellip;</p></div>';
            (document.body || document.documentElement).appendChild(veil);

            try {
                const check = await authManager.requireSession(['teacher']);
                if (check.ok) { veil.remove(); return; }
                // Leave the veil up through the redirect so the portal never
                // flashes at someone who is not entitled to it.
                window.location.replace(check.reason === 'forbidden'
                    ? authManager.getRedirectUrl(check.session.role)
                    : 'login.html');
            } catch (err) {
                console.error('Session verification failed:', err);
                window.location.replace('login.html');
            }
        })();

        // ── Mobile sidebar drawer ──
        function setSidebarOpen(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const menuBtn = document.querySelector('.mobile-menu-btn');

            sidebar.classList.toggle('open', open);
            if (overlay) overlay.classList.toggle('open', open);
            if (menuBtn) menuBtn.setAttribute('aria-expanded', String(open));
            // Stop the page behind the drawer scrolling under the user's finger.
            document.body.style.overflow = open ? 'hidden' : '';
        }

        function closeSidebar() {
            setSidebarOpen(false);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            setSidebarOpen(!sidebar.classList.contains('open'));
        }

        // Picking a page closes the drawer — otherwise it covers what was asked for.
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 1024 && e.target.closest('.nav-sidebar .nav-link')) closeSidebar();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('sidebar')?.classList.contains('open')) {
                closeSidebar();
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 1024) closeSidebar();
        });

        // Logout function — exposed on window so onclick="logout()" always finds it
        window.logout = async function logout() {
            if (!confirm('Sign out of the teacher portal?')) return;
            try {
                await authManager.logout('login.html');
            } catch (err) {
                console.error('Logout error:', err);
                // Force redirect even if signOut throws
                localStorage.removeItem('sb_session');
                localStorage.removeItem('school_portal_session');
                window.location.href = 'login.html';
            }
        };
    </script>
