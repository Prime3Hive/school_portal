<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img"
     aria-labelledby="portal-preview-title">
  <title id="portal-preview-title">The TBD parent portal on a phone, showing a termly result sheet</title>
  <!--
    Branded stand-in, drawn to match the real "My Grades" view in
    student-portal.html. Same convention as assets/campus-panel.svg.

    Replace with a genuine screenshot when one is available — and when
    you do, use a demo pupil, not a real one. Never publish a real
    child's name, photograph or admission number.
  -->
  <defs>
    <linearGradient id="pp-nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3D7D"/>
      <stop offset="1" stop-color="#1E2A5A"/>
    </linearGradient>
  </defs>

  <rect width="320" height="640" fill="#F5F7FC"/>

  <!-- App bar -->
  <rect width="320" height="104" fill="url(#pp-nav)"/>
  <circle cx="34" cy="52" r="15" fill="#FFFFFF" opacity="0.16"/>
  <text x="34" y="57" font-family="Outfit, Segoe UI, sans-serif" font-size="14" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="60" y="47" font-family="Outfit, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Ada (demo pupil)</text>
  <text x="60" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.72">Basic 4 &#183; 2026/2027</text>
  <text x="20" y="90" font-family="Outfit, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">My Grades</text>

  <!-- Term selector -->
  <rect x="20" y="120" width="86" height="28" rx="14" fill="#1E2A5A"/>
  <text x="63" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600"
        fill="#FFFFFF" text-anchor="middle">First Term</text>
  <rect x="114" y="120" width="90" height="28" rx="14" fill="#FFFFFF" stroke="#DDE3F0"/>
  <text x="159" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600"
        fill="#5A6480" text-anchor="middle">Second Term</text>

  <!-- Summary card -->
  <rect x="20" y="162" width="280" height="78" rx="16" fill="#FFFFFF" stroke="#E4E9F4"/>
  <text x="38" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="600"
        letter-spacing="0.8" fill="#8A93AC">TERM AVERAGE</text>
  <text x="38" y="220" font-family="Outfit, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#1E2A5A">86.4%</text>
  <rect x="196" y="176" width="86" height="24" rx="12" fill="#E7F6EF"/>
  <text x="239" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700"
        fill="#12764B" text-anchor="middle">Position 3</text>
  <text x="239" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="10"
        fill="#5A6480" text-anchor="middle">of 28 pupils</text>

  <!-- Subject rows -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="11">
    <rect x="20" y="256" width="280" height="46" rx="12" fill="#FFFFFF" stroke="#E4E9F4"/>
    <text x="38" y="277" font-weight="600" fill="#1B2135">Mathematics</text>
    <text x="38" y="292" font-size="9" fill="#8A93AC">CA 28 &#183; Exam 62</text>
    <text x="282" y="284" font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700"
          fill="#12764B" text-anchor="end">90</text>

    <rect x="20" y="310" width="280" height="46" rx="12" fill="#FFFFFF" stroke="#E4E9F4"/>
    <text x="38" y="331" font-weight="600" fill="#1B2135">English Language</text>
    <text x="38" y="346" font-size="9" fill="#8A93AC">CA 26 &#183; Exam 58</text>
    <text x="282" y="338" font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700"
          fill="#12764B" text-anchor="end">84</text>

    <rect x="20" y="364" width="280" height="46" rx="12" fill="#FFFFFF" stroke="#E4E9F4"/>
    <text x="38" y="385" font-weight="600" fill="#1B2135">Basic Science</text>
    <text x="38" y="400" font-size="9" fill="#8A93AC">CA 27 &#183; Exam 61</text>
    <text x="282" y="392" font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700"
          fill="#12764B" text-anchor="end">88</text>

    <rect x="20" y="418" width="280" height="46" rx="12" fill="#FFFFFF" stroke="#E4E9F4"/>
    <text x="38" y="439" font-weight="600" fill="#1B2135">Civic Education</text>
    <text x="38" y="454" font-size="9" fill="#8A93AC">CA 24 &#183; Exam 55</text>
    <text x="282" y="446" font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700"
          fill="#B26A00" text-anchor="end">79</text>

    <rect x="20" y="472" width="280" height="46" rx="12" fill="#FFFFFF" stroke="#E4E9F4"/>
    <text x="38" y="493" font-weight="600" fill="#1B2135">Agricultural Science</text>
    <text x="38" y="508" font-size="9" fill="#8A93AC">CA 29 &#183; Exam 62</text>
    <text x="282" y="500" font-family="Outfit, Segoe UI, sans-serif" font-size="16" font-weight="700"
          fill="#12764B" text-anchor="end">91</text>
  </g>

  <!-- Teacher remark -->
  <rect x="20" y="532" width="280" height="62" rx="14" fill="#EEF2FC"/>
  <text x="38" y="554" font-family="Inter, Segoe UI, sans-serif" font-size="9" font-weight="600"
        letter-spacing="0.8" fill="#5A6480">CLASS TEACHER&#8217;S REMARK</text>
  <text x="38" y="572" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1B2135">A steady, thorough term. Keep</text>
  <text x="38" y="586" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1B2135">up the reading at home.</text>

  <!-- Tab bar -->
  <rect x="0" y="604" width="320" height="36" fill="#FFFFFF"/>
  <line x1="0" y1="604" x2="320" y2="604" stroke="#E4E9F4"/>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="9" text-anchor="middle">
    <text x="53" y="627" font-weight="600" fill="#1E2A5A">Grades</text>
    <text x="133" y="627" fill="#8A93AC">Fees</text>
    <text x="213" y="627" fill="#8A93AC">Schedule</text>
    <text x="285" y="627" fill="#8A93AC">More</text>
  </g>
</svg>
