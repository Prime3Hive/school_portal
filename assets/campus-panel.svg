<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="tbd-panel-title">
  <title id="tbd-panel-title">TBD International Academy — Planting Seeds of Knowledge</title>
  <!--
    Stand-in for a campus photograph. Drop a real photo into the hero <img> in
    public-blog.html when one is available; until then this keeps the hero on
    brand and free of any third-party image service.
  -->
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3D7D" />
      <stop offset="0.55" stop-color="#1E2A5A" />
      <stop offset="1" stop-color="#141C3E" />
    </linearGradient>
    <radialGradient id="panelWash" cx="0.88" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#E23C3C" stop-opacity="0.34" />
      <stop offset="1" stop-color="#E23C3C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panelShield" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2E3D7D" />
      <stop offset="1" stop-color="#1A2450" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#panelBg)" />
  <rect width="800" height="600" fill="url(#panelWash)" />

  <!-- Content sits in the upper two-thirds: the hero overlays a stats card
       across the bottom of this panel. -->
  <circle cx="400" cy="168" r="98" fill="#FFFFFF" />
  <g transform="translate(335 103) scale(0.65)">
    <path d="M100 4 192 34v82c0 54-42 88-92 100C50 204 8 170 8 116V34Z" fill="url(#panelShield)" />
    <g fill="#FFFFFF">
      <path d="M100 42 164 70l-64 28-64-28Z" />
      <path d="M72 84v16c0 10 56 10 56 0V84l-28 12Z" />
    </g>
    <path d="M164 70v24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M164 94c6 6 6 14 0 18-6-4-6-12 0-18Z" fill="#FFFFFF" />
    <path d="M100 124c-13-11-36-15-58-13v54c22-2 45 2 58 13Z" fill="#FFFFFF" />
    <path d="M100 124c13-11 36-15 58-13v54c-22-2-45 2-58 13Z" fill="#FFFFFF" />
    <path d="M100 124v54" stroke="#1A2450" stroke-width="3" stroke-linecap="round" />
    <g stroke="#1A2450" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M54 128h32M54 140h32M54 152h32M54 164h32" />
      <path d="M114 128h32M114 140h32M114 152h32M114 164h32" />
    </g>
  </g>

  <text x="400" y="318" fill="#FFFFFF" text-anchor="middle"
        font-family="Outfit, Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="40">
    TBD International Academy
  </text>

  <rect x="236" y="344" width="328" height="44" rx="8" fill="#E23C3C" />
  <text x="400" y="373" fill="#FFFFFF" text-anchor="middle"
        font-family="Outfit, Inter, 'Segoe UI', sans-serif" font-weight="600" font-style="italic" font-size="20">
    Planting Seeds of Knowledge
  </text>
</svg>
